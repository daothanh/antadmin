# CI/CD cho __APP_NAME__ (Nuxt 4 + pnpm).
#
# Mẫu này dựa trên hạ tầng đã triển khai thực tế cho một sản phẩm AntAdmin: build +
# deploy bằng Docker trên MỘT GitLab Runner executor=shell cài sẵn trên máy dev
# (không cần docker:dind, không cần "image:" — shell executor bỏ qua các thứ đó).
#
# Hạ tầng giả định — chỉnh lại cho khớp hạ tầng thật của team trước khi dùng:
#   - Runner mang tag "dev" (đổi "tags:" bên dưới nếu team dùng runner/tag khác).
#   - Máy chạy runner có docker (BuildKit) + docker compose plugin + tới được
#     registry image (đổi REGISTRY_HOST/IMAGE bên dưới cho khớp registry/namespace
#     thật — mặc định trỏ registry nội bộ tập đoàn).
#   - Prod bị cô lập khỏi GitLab → không deploy qua CI; xem scripts/deploy-prod.sh.
#     Nếu team có mạng riêng cho phép CI reach tới prod, có thể thêm job
#     deploy:prod tương tự deploy:dev với rule main + `when: manual`.
#
# Luồng:
#   MR                → check (lint + typecheck, chạy trong docker build)
#   dev               → check → build+push image → deploy lên máy dev (auto)
#   main / tag        → check → build+push image (prod pull thủ công qua script)
#
# Biến ở Settings → CI/CD → Variables (Masked, Protected):
#   REGISTRY_USER, REGISTRY_PASSWORD   đăng nhập registry image
#   NUXT_SESSION_SECRET                khoá ký cookie session (bắt buộc, xem .env.example)
#   NUXT_AUTH_BASE_URL                 URL IAM/gateway (compose có default nếu trống)

stages:
  - check
  - build
  - deploy

variables:
  REGISTRY_HOST: registry.antadmin.com # đổi theo registry thật của team
  IMAGE: ${REGISTRY_HOST}/antadmin/__APP_NAME__ # đổi namespace (group/project) cho khớp registry
  DOCKER_BUILDKIT: '1'

# Tránh chạy trùng pipeline (branch push + MR event cho cùng commit).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# 1) Check: eslint + vue-tsc — chạy trong docker (host không cần node/pnpm).
#    Target "check" dùng chung layer cài deps với build:image nên lần build
#    sau gần như trúng cache toàn bộ.
# ---------------------------------------------------------------------------
check:
  stage: check
  tags:
    - dev
  retry: 2 # mạng runner ra npm registry chập chờn — tự retry nếu fail
  script:
    - docker build --target check .

# ---------------------------------------------------------------------------
# 2) Build & push image bằng docker của host (chạy trên runner shell tag "dev").
#    Chạy cho: dev, main, và tag.
# ---------------------------------------------------------------------------
build:image:
  stage: build
  tags:
    - dev
  retry: 2
  script:
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
    # Tag theo SHA (bất biến, dùng để deploy) + theo tên nhánh/tag (main / dev / vX.Y.Z).
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# 3) Deploy lên máy dev (image vừa build đã có sẵn local trên cùng host).
# ---------------------------------------------------------------------------
deploy:dev:
  stage: deploy
  tags:
    - dev
  variables:
    WEB_IMAGE: '$IMAGE:$CI_COMMIT_SHORT_SHA'
  script:
    - export WEB_IMAGE NUXT_SESSION_SECRET NUXT_AUTH_BASE_URL NUXT_API_PROXY_TARGET
    - docker compose -p __APP_NAME__ -f docker-compose.dev.yml up -d
    - docker image prune -f
  environment:
    name: dev
    url: http://vm-general:3001 # đổi host/cổng theo port map trong docker-compose.dev.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  resource_group: dev

# ---------------------------------------------------------------------------
# 4) Prod: mặc định KHÔNG deploy qua CI (giả định máy prod bị cô lập khỏi
#    GitLab). Sau khi build:image trên nhánh main xong, đăng nhập máy prod và
#    chạy:
#        ./scripts/deploy-prod.sh <SHA hoặc main>
#    Script sẽ pull image từ registry và up -d bằng docker-compose.prod.yml
#    (env prod đọc từ file .env đặt cạnh compose trên máy prod).
# ---------------------------------------------------------------------------
