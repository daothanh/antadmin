# Deploy docs (VitePress) + Storybook lên GitHub Pages.
# Docs phục vụ ở "/antadmin/" (base trong docs/.vitepress/config.ts),
# Storybook nhét vào "/antadmin/storybook".
name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build @antadmin/theme + @antadmin/ui
        run: pnpm --filter "@antadmin/ui..." build
      - name: Build Storybook
        run: pnpm --filter @antadmin/ui build-storybook   # -> packages/ui/storybook-static
      - name: Build VitePress docs
        run: pnpm --filter docs build                      # -> docs/.vitepress/dist
      - name: Ghép Storybook vào dist docs
        run: cp -R packages/ui/storybook-static docs/.vitepress/dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4